name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Default base "/" for smoke (WebGL boot) + path-prefix build check
      - run: npm run build
      - name: Boot smoke
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.5
          done
          # Fail if HUD stays on HTML defaults or UI never binds
          BOOT_URL=http://127.0.0.1:4173/ npm run test:smoke
      - name: GitHub Pages base path build
        run: |
          GITHUB_PAGES=true npm run build
          grep -q '/bonsai-en/' dist/index.html

