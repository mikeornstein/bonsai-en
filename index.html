<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#e6e1d8" />
    <meta
      name="description"
      content="Bonsai-en — a quiet 3D juniper training room."
    />
    <title>Bonsai-en</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>
      <div id="hud">
        <header class="hud-header">
          <h1>Bonsai-en</h1>
          <p id="status" class="status">Juniper sapling</p>
        </header>

        <section class="panel tools" aria-label="Tools">
          <button type="button" data-tool="inspect" class="tool active" title="Inspect (I)">
            Inspect
          </button>
          <button type="button" data-tool="prune" class="tool" title="Prune (P)">
            Prune
          </button>
          <button type="button" data-tool="pinch" class="tool" title="Pinch (N)">
            Pinch
          </button>
          <button type="button" data-tool="wire" class="tool" title="Wire (W)">
            Wire
          </button>
          <button type="button" data-tool="unwire" class="tool" title="Remove wire (U)">
            Unwire
          </button>
        </section>

        <section class="panel time" aria-label="Time controls">
          <button type="button" data-speed="0" class="speed" title="Still">Still</button>
          <button type="button" data-speed="live" class="speed active" title="Live">Live</button>
          <button type="button" data-speed="day" class="speed" title="Day speed">Day</button>
          <button type="button" data-speed="week" class="speed" title="Season pace">Season</button>
          <button type="button" data-speed="month" class="speed" title="Month pace">Mo</button>
          <button type="button" data-speed="year" class="speed" title="Years pace">Years</button>
        </section>

        <section class="panel meta" aria-label="Tree info">
          <div id="info">
            <div><span class="label">Age</span> <span id="info-age">—</span></div>
            <div><span class="label">Season</span> <span id="info-season">—</span></div>
            <div class="vitality-row">
              <span class="label">Vitality</span>
              <span class="vitality-track" aria-hidden="true"
                ><span id="info-vitality-bar" class="vitality-bar"></span
              ></span>
              <span id="info-reserves" class="vitality-word">—</span>
            </div>
            <div id="info-practice-row" class="practice-row hidden">
              <span class="label">Practice</span>
              <span id="info-practice">—</span>
            </div>
            <div id="info-nodes-row" class="debug-only hidden">
              <span class="label">Nodes</span> <span id="info-nodes">—</span>
            </div>
            <div id="info-practice-best" class="practice-best hidden" aria-live="polite">
              <span class="label">Best</span>
              <span id="info-practice-best-val">—</span>
            </div>
            <div id="info-selection" class="selection">This branch</div>
          </div>
        </section>

        <section class="panel files" aria-label="Save and share">
          <div class="files-menu">
            <button
              type="button"
              id="btn-files"
              class="files-toggle"
              title="Save, share, and files"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="files-menu"
            >
              ⋯
            </button>
            <div id="files-menu" class="files-dropdown" hidden role="menu">
              <button type="button" id="btn-new" role="menuitem" title="New sapling">
                New
              </button>
              <button
                type="button"
                id="btn-undo"
                role="menuitem"
                title="Undo last prune, pinch, wire, or unwire (Z)"
              >
                Undo last
              </button>
              <button
                type="button"
                id="btn-frame"
                role="menuitem"
                title="Fit the whole tree in view (growth will not reframe after you orbit)"
              >
                Frame tree
              </button>
              <button type="button" id="btn-save" role="menuitem" title="Save locally">
                Save
              </button>
              <button
                type="button"
                id="btn-share"
                role="menuitem"
                title="Share a link, Messages sheet, or draft a post to X with a portrait"
              >
                Share
              </button>
              <button
                type="button"
                id="btn-export"
                role="menuitem"
                title="Always download full JSON (best for backups and large trees)"
              >
                Export
              </button>
              <button type="button" id="btn-import" role="menuitem" title="Import JSON">
                Import
              </button>
              <button type="button" id="btn-mute" role="menuitem" title="Sound on/off">
                Sound off
              </button>
              <button
                type="button"
                id="btn-sumi"
                role="menuitem"
                title="Sandbox without the sumi silhouette guide"
              >
                Free train
              </button>
              <button
                type="button"
                id="btn-front-lock"
                role="menuitem"
                title="Keep camera on the viewing face while scoring"
              >
                Lock front
              </button>
              <button
                type="button"
                id="btn-practice-pack"
                role="menuitem"
                title="Cycle practice silhouette (moyogi → cascade → literati)"
              >
                Shape: Moyogi
              </button>
            </div>
          </div>
          <input
            type="file"
            id="import-file"
            accept="application/json,.json,.bonsai.json"
            hidden
          />
        </section>

        <div
          id="share-backdrop"
          class="share-backdrop"
          hidden
          role="presentation"
        >
          <div
            id="share-panel"
            class="share-panel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="share-title"
          >
            <header class="share-header">
              <h2 id="share-title" class="share-title">Share</h2>
              <button
                type="button"
                id="share-close"
                class="share-close"
                aria-label="Close share"
                title="Close"
              >
                ×
              </button>
            </header>
            <p id="share-hint" class="share-hint">
              Share a portrait (Messages / X). Copy link only if you need a full
              restore URL — it is long by design.
            </p>
            <p id="share-url" class="share-url" hidden></p>
            <div class="share-actions">
              <button
                type="button"
                id="share-system"
                title="Share the portrait image (and a short caption) — no long link"
              >
                Messages / Share…
              </button>
              <button
                type="button"
                id="share-x"
                title="Open X with a short caption; portrait image is saved for you to attach"
              >
                Post to X
              </button>
              <button
                type="button"
                id="share-image"
                title="Download a PNG portrait of the tree"
              >
                Save image
              </button>
              <button
                type="button"
                id="share-copy"
                title="Copy a full tree restore URL (long). Prefer image share for social."
              >
                Copy restore link
              </button>
            </div>
          </div>
        </div>

        <p class="hint" id="hint">
          Match the ink · prune outside · wire the trunk · grow into the pad
        </p>

        <details class="checklist" id="checklist" hidden>
          <summary class="checklist-summary">
            Path
            <span class="checklist-count" id="checklist-count" aria-live="polite"></span>
          </summary>
          <ul class="checklist-list" id="checklist-list"></ul>
        </details>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
