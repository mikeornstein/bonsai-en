<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#e6e1d8" />
    <meta
      name="description"
      content="Bonsai-en — a quiet 3D juniper training room."
    />
    <title>Bonsai-en</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>
      <div id="hud">
        <header class="hud-header">
          <h1>Bonsai-en</h1>
          <p id="status" class="status">Juniper sapling</p>
        </header>

        <section class="panel tools" aria-label="Tools">
          <button type="button" data-tool="inspect" class="tool active" title="Inspect (I)">
            Inspect
          </button>
          <button type="button" data-tool="prune" class="tool" title="Prune (P)">
            Prune
          </button>
          <button type="button" data-tool="pinch" class="tool" title="Pinch (N)">
            Pinch
          </button>
          <button type="button" data-tool="wire" class="tool" title="Wire (W)">
            Wire
          </button>
          <button type="button" data-tool="unwire" class="tool" title="Remove wire (U)">
            Unwire
          </button>
        </section>

        <section class="panel time" aria-label="Time controls">
          <button type="button" data-speed="0" class="speed" title="Still">Still</button>
          <button type="button" data-speed="live" class="speed active" title="Live">Live</button>
          <button type="button" data-speed="day" class="speed" title="Day speed">Day</button>
          <button type="button" data-speed="week" class="speed" title="Season pace">Season</button>
          <button type="button" data-speed="month" class="speed" title="Month pace">Mo</button>
          <button type="button" data-speed="year" class="speed" title="Years pace">Years</button>
        </section>

        <section class="panel meta" aria-label="Tree info">
          <div id="info">
            <div><span class="label">Age</span> <span id="info-age">—</span></div>
            <div><span class="label">Season</span> <span id="info-season">—</span></div>
            <div class="vitality-row">
              <span class="label">Vitality</span>
              <span class="vitality-track" aria-hidden="true"
                ><span id="info-vitality-bar" class="vitality-bar"></span
              ></span>
              <span id="info-reserves" class="vitality-word">—</span>
            </div>
            <div id="info-nodes-row" class="debug-only hidden">
              <span class="label">Nodes</span> <span id="info-nodes">—</span>
            </div>
            <div id="info-selection" class="selection">This branch</div>
          </div>
        </section>

        <section class="panel files" aria-label="Save and share">
          <div class="files-menu">
            <button
              type="button"
              id="btn-files"
              class="files-toggle"
              title="Save, share, and files"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="files-menu"
            >
              ⋯
            </button>
            <div id="files-menu" class="files-dropdown" hidden role="menu">
              <button type="button" id="btn-new" role="menuitem" title="New sapling">
                New
              </button>
              <button type="button" id="btn-save" role="menuitem" title="Save locally">
                Save
              </button>
              <button
                type="button"
                id="btn-share"
                role="menuitem"
                title="Copy a share link when the tree fits in a URL; falls back to a file for very large trees"
              >
                Share
              </button>
              <button
                type="button"
                id="btn-export"
                role="menuitem"
                title="Always download full JSON (best for backups and large trees)"
              >
                Export
              </button>
              <button type="button" id="btn-import" role="menuitem" title="Import JSON">
                Import
              </button>
              <button type="button" id="btn-mute" role="menuitem" title="Sound on/off">
                Sound off
              </button>
              <button
                type="button"
                id="btn-sumi"
                role="menuitem"
                title="Optional sumi silhouette practice"
              >
                Practice
              </button>
            </div>
          </div>
          <input
            type="file"
            id="import-file"
            accept="application/json,.json,.bonsai.json"
            hidden
          />
        </section>

        <p class="hint" id="hint">
          Drag to orbit · Pinch/scroll to zoom · Select a tool, then tap a branch
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
