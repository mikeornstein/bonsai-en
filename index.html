<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#e6e1d8" />
    <meta
      name="description"
      content="Bonsai-en — a biologically grounded 3D bonsai training simulation."
    />
    <title>Bonsai-en</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>
      <div id="hud">
        <header class="hud-header">
          <h1>Bonsai-en</h1>
          <p id="status" class="status">Juniper sapling</p>
        </header>

        <section class="panel tools" aria-label="Tools">
          <button type="button" data-tool="inspect" class="tool active" title="Inspect (I)">
            Inspect
          </button>
          <button type="button" data-tool="prune" class="tool" title="Prune (P)">
            Prune
          </button>
          <button type="button" data-tool="pinch" class="tool" title="Pinch (N)">
            Pinch
          </button>
          <button type="button" data-tool="wire" class="tool" title="Wire (W)">
            Wire
          </button>
          <button type="button" data-tool="unwire" class="tool" title="Remove wire (U)">
            Unwire
          </button>
        </section>

        <section class="panel time" aria-label="Time controls">
          <button type="button" data-speed="0" class="speed" title="Pause">⏸</button>
          <button type="button" data-speed="live" class="speed active" title="Live">▶</button>
          <button type="button" data-speed="day" class="speed" title="1 day / sec">Day</button>
          <button type="button" data-speed="week" class="speed" title="1 week / sec">Wk</button>
          <button type="button" data-speed="month" class="speed" title="1 month / sec">Mo</button>
          <button type="button" data-speed="year" class="speed" title="1 year / sec">Yr</button>
        </section>

        <section class="panel meta" aria-label="Tree info">
          <div id="info">
            <div><span class="label">Age</span> <span id="info-age">0 d</span></div>
            <div><span class="label">Season</span> <span id="info-season">—</span></div>
            <div><span class="label">Reserves</span> <span id="info-reserves">—</span></div>
            <div><span class="label">Nodes</span> <span id="info-nodes">—</span></div>
            <div id="info-selection" class="selection">Select a branch</div>
          </div>
        </section>

        <section class="panel files" aria-label="Save and share">
          <button type="button" id="btn-new" title="New sapling">New</button>
          <button type="button" id="btn-save" title="Save locally">Save</button>
          <button type="button" id="btn-export" title="Export JSON">Export</button>
          <button type="button" id="btn-import" title="Import JSON">Import</button>
          <button type="button" id="btn-share" title="Copy share link">Share</button>
          <input type="file" id="import-file" accept="application/json,.json,.bonsai.json" hidden />
        </section>

        <p class="hint" id="hint">
          Drag to orbit · Pinch/scroll to zoom · Select a tool, then tap a branch
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
